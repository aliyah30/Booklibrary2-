<div class="book-detail-container">
  <div *ngIf="loading" class="loading">
    <p>Loading book details...</p>
  </div>

  <div *ngIf="errorMessage" class="error-message">
    <p>{{ errorMessage }}</p>
    <button (click)="router.navigate(['/books'])">Back to Books</button>
  </div>

  <div *ngIf="book && !loading" class="book-info">
    <h2>{{ book.title }}</h2>
    <div class="book-details">
      <p><strong>Author:</strong> {{ book.author }}</p>
      <p><strong>ISBN:</strong> {{ book.isbn }}</p>
      <p><strong>Publication Date:</strong> {{ book.publication_date }}</p>
      <p><strong>Available Copies:</strong> {{ book.available_copies }} / {{ book.total_copies }}</p>
    </div>
    
    <div class="actions">
      <button (click)="router.navigate(['/books'])">Back to Book List</button>
    </div>
  </div>
</div>
